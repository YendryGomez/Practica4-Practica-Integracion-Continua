name: Alerta NTFY

on:
  push:
    branches:
      - main

jobs:
  notificacion:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar notificación a ntfy
        run: |
          curl -H "Title: Nuevo Push" \
               -H "Priority: high" \
               -d "Se realizó un push al repositorio en la rama main." \
               https://ntfy.sh/devops-itla